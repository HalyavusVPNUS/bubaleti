name: Update VLESS subscription

on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch:       # ручной запуск кнопкой

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build subscription
        run: python json2vless.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vless.txt vless_base64.txt
          git diff --cached --quiet || (git commit -m "update subscription" && git push)
